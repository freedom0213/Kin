<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Kin 交互式页面设计原型" />
  <title>Kin · 页面设计 Demo</title>
  <style>
    /* PROTOTYPE — 三种 Kin 页面查看方式，通过 ?variant=flow|gallery|lab 切换。 */
    :root {
      --paper: #f4f5f2;
      --surface: #ffffff;
      --ink: #171a1f;
      --muted: #70757d;
      --faint: #a5a9ae;
      --line: #e2e5e1;
      --accent: #2dad82;
      --accent-dark: #176b52;
      --accent-soft: #e2f2ec;
      --blue-soft: #dce8f0;
      --danger: #b43a33;
      --danger-soft: #f7e8e5;
      --phone-w: 375px;
      --phone-h: 760px;
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #e9ebe7;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(45, 173, 130, .28);
      outline-offset: 2px;
    }

    .prototype-note {
      position: fixed;
      top: 16px;
      left: 18px;
      z-index: 80;
      padding: 8px 11px;
      border: 1px solid rgba(23, 26, 31, .12);
      border-radius: 10px;
      background: rgba(255, 255, 255, .92);
      color: var(--muted);
      font-size: 11px;
      box-shadow: 0 8px 24px rgba(31, 38, 34, .08);
    }

    #app { min-height: 100vh; }
    .workspace {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
    }
    .rail {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 78px 22px 110px;
      border-right: 1px solid rgba(23, 26, 31, .09);
      background: rgba(244, 245, 242, .88);
      overflow-y: auto;
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 34px; }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 13px;
      display: grid; place-items: center;
      background: var(--ink); color: white; font-size: 18px; font-weight: 800;
    }
    .brand strong { display: block; font-size: 18px; }
    .brand span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
    .rail-label { margin: 24px 10px 8px; color: var(--faint); font-size: 11px; font-weight: 700; }
    .page-nav { display: grid; gap: 4px; }
    .page-nav button {
      width: 100%; min-height: 44px; padding: 0 12px;
      display: flex; align-items: center; justify-content: space-between;
      border: 0; border-radius: 12px; background: transparent;
      text-align: left; cursor: pointer;
    }
    .page-nav button:hover { background: rgba(255, 255, 255, .72); }
    .page-nav button.active { background: var(--surface); box-shadow: 0 7px 24px rgba(31, 38, 34, .07); }
    .nav-index { color: var(--faint); font-size: 11px; }
    .rail-copy { margin: 28px 10px 0; color: var(--muted); font-size: 12px; line-height: 1.65; }

    .stage {
      min-width: 0;
      padding: 64px 52px 120px;
      display: grid;
      align-content: start;
      justify-items: center;
    }
    .stage-heading { width: min(820px, 100%); margin-bottom: 28px; }
    .stage-kicker { color: var(--accent-dark); font-size: 12px; font-weight: 750; }
    .stage-heading h1 { margin: 7px 0 8px; font-size: clamp(26px, 4vw, 42px); letter-spacing: -.035em; }
    .stage-heading h1, .gallery-heading h1, .lab-heading h1 { font-family: ui-serif, "Songti SC", STSong, serif; }
    .stage-heading p { max-width: 680px; margin: 0; color: var(--muted); line-height: 1.7; }

    .phone-wrap { position: relative; }
    .phone {
      position: relative;
      width: var(--phone-w); height: var(--phone-h);
      overflow: hidden;
      display: flex; flex-direction: column;
      border: 8px solid #202421;
      border-radius: 48px;
      background: var(--paper);
      box-shadow: 0 28px 70px rgba(31, 38, 34, .22), 0 3px 0 #111512;
    }
    .phone::before {
      content: "";
      position: absolute; top: 9px; left: 50%; transform: translateX(-50%);
      z-index: 20; width: 102px; height: 25px; border-radius: 14px;
      background: #202421;
    }
    .status-bar {
      position: relative; z-index: 15;
      height: 44px; padding: 12px 22px 0;
      display: flex; align-items: center; justify-content: space-between;
      color: var(--ink); font-size: 11px; font-weight: 750;
    }
    .status-icons { display: flex; align-items: center; gap: 5px; }
    .signal { display: flex; align-items: flex-end; gap: 2px; height: 10px; }
    .signal i { width: 2px; border-radius: 1px; background: currentColor; }
    .signal i:nth-child(1) { height: 4px; } .signal i:nth-child(2) { height: 6px; }
    .signal i:nth-child(3) { height: 8px; } .signal i:nth-child(4) { height: 10px; }
    .battery { width: 18px; height: 9px; padding: 1px; border: 1px solid currentColor; border-radius: 3px; }
    .battery::after { content: ""; display: block; width: 80%; height: 100%; border-radius: 1px; background: currentColor; }
    .screen { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
    .scroll::-webkit-scrollbar { display: none; }

    .topbar {
      min-height: 58px; padding: 7px 12px 9px;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--line); background: rgba(244, 245, 242, .95);
    }
    .top-action {
      width: 44px; height: 44px; border: 0; border-radius: 50%;
      display: grid; place-items: center; background: transparent; cursor: pointer;
    }
    .top-action:hover { background: rgba(23, 26, 31, .05); }
    .back-icon { width: 11px; height: 11px; border-left: 2px solid; border-bottom: 2px solid; transform: rotate(45deg); }
    .more-icon { display: flex; gap: 3px; }
    .more-icon i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
    .top-title { flex: 1; min-width: 0; text-align: center; }
    .top-title strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; }
    .presence { margin-top: 3px; display: flex; align-items: center; justify-content: center; gap: 5px; color: var(--accent-dark); font-size: 11px; }
    .presence.offline { color: var(--muted); }
    .presence-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    .avatar {
      position: relative; flex: 0 0 auto;
      display: grid; place-items: center;
      background: #28313a; color: white; font-weight: 750;
    }
    .avatar.sm { width: 46px; height: 46px; border-radius: 50%; font-size: 14px; }
    .avatar.lg { width: 78px; height: 78px; border-radius: 50%; font-size: 23px; }
    .avatar.online::before {
      content: ""; position: absolute; inset: -5px; border: 2px solid rgba(45, 173, 130, .34); border-radius: 50%;
      animation: breathe 3.6s var(--pulse-delay, 0ms) ease-in-out infinite;
    }
    .avatar.online.arrival::before { animation: online-arrival .52s cubic-bezier(.16, 1, .3, 1), breathe 3.6s .52s ease-in-out infinite; }
    .avatar::after {
      content: ""; position: absolute; right: -1px; bottom: 2px;
      width: 11px; height: 11px; border: 2px solid white; border-radius: 50%; background: var(--faint);
    }
    .avatar.online::after { background: var(--accent); }
    @keyframes breathe { 0%, 100% { transform: scale(.98); opacity: .35; } 50% { transform: scale(1.12); opacity: .08; } }
    @keyframes online-arrival { 0% { transform: scale(.92); opacity: 0; } 18% { opacity: .5; } 100% { transform: scale(1.48); opacity: 0; } }

    .auth-screen { padding: 72px 28px 28px; background: var(--surface); }
    .auth-brand { margin-bottom: 46px; text-align: center; }
    .auth-brand b { font-size: 37px; letter-spacing: -.05em; }
    .auth-brand p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .field-label { display: block; margin: 15px 2px 7px; color: var(--muted); font-size: 11px; }
    .field {
      width: 100%; min-height: 48px; padding: 0 15px;
      border: 1px solid var(--line); border-radius: 14px; background: #fafbf9; color: var(--ink);
    }
    .primary {
      width: 100%; min-height: 48px; margin-top: 22px;
      border: 0; border-radius: 15px; background: var(--ink); color: white; font-weight: 750; cursor: pointer;
    }
    .text-link { width: 100%; margin-top: 18px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }

    .home-head { padding: 22px 20px 15px; display: flex; align-items: center; justify-content: space-between; }
    .home-head h2 { margin: 0; font-size: 22px; letter-spacing: -.03em; }
    .home-actions { display: flex; gap: 8px; }
    .small-action { min-height: 38px; padding: 0 12px; border: 0; border-radius: 19px; background: var(--accent-soft); color: var(--accent-dark); font-size: 12px; font-weight: 700; cursor: pointer; }
    .circle-action { width: 38px; padding: 0; border-radius: 50%; background: #eaede9; color: var(--ink); }
    .presence-demo {
      min-height: 34px; margin: 0 20px 2px; padding: 0 12px;
      border: 1px solid #cfe6dd; border-radius: 17px; background: #f1f8f5;
      color: var(--accent-dark); font-size: 11px; font-weight: 750; cursor: pointer;
    }
    .section-head { padding: 17px 20px 8px; display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 800; }
    .section-head span { color: var(--faint); font-weight: 600; }
    .conversation {
      width: 100%; min-height: 76px; padding: 10px 18px;
      display: flex; align-items: center; gap: 13px;
      border: 0; border-bottom: 1px solid var(--line); background: var(--surface); text-align: left; cursor: pointer;
    }
    .conversation:hover { background: #fafbf9; }
    .conversation.presence-arrival { animation: row-arrival .42s cubic-bezier(.16, 1, .3, 1); }
    .conversation[data-person="momo"] { view-transition-name: momo-conversation; }
    ::view-transition-group(momo-conversation) { animation-duration: .36s; animation-timing-function: cubic-bezier(.16, 1, .3, 1); }
    @keyframes row-arrival { 0% { background: #eaf7f2; } 100% { background: var(--surface); } }
    .conversation-copy { flex: 1; min-width: 0; }
    .conversation-name { font-size: 15px; font-weight: 700; }
    .conversation-preview { margin-top: 5px; overflow: hidden; color: var(--muted); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .conversation-meta { min-width: 50px; align-self: stretch; padding-top: 6px; display: flex; flex-direction: column; align-items: flex-end; color: var(--faint); font-size: 11px; }
    .unread { min-width: 20px; height: 20px; margin-top: 9px; padding: 0 6px; display: grid; place-items: center; border-radius: 10px; background: var(--accent); color: white; font-size: 10px; font-weight: 800; }
    .status-check { margin-top: 8px; color: var(--accent); font-size: 11px; }

    .ambient { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .ambient::before, .ambient::after { content: ""; position: absolute; border-radius: 50%; animation: drift 12s ease-in-out infinite alternate; }
    .ambient::before { width: 270px; height: 270px; left: -110px; top: 60px; background: rgba(111, 205, 170, .20); }
    .ambient::after { width: 320px; height: 320px; right: -150px; bottom: 40px; background: rgba(126, 165, 199, .15); animation-duration: 15s; animation-direction: alternate-reverse; }
    .chat-offline .ambient::before { background: rgba(176, 184, 179, .18); animation-duration: 18s; }
    .chat-offline .ambient::after { background: rgba(187, 190, 184, .16); animation-duration: 20s; }
    @keyframes drift { to { transform: translate3d(32px, 26px, 0) scale(1.08); } }
    .notice { position: relative; z-index: 3; min-height: 35px; padding: 8px 14px; display: flex; align-items: center; justify-content: center; gap: 7px; border-bottom: 1px solid #d7d9d5; background: #e7e8e5; color: #565b61; font-size: 11px; }
    .notice.secure { background: var(--accent-soft); border-color: #c8e4da; color: var(--accent-dark); }
    .chat-list { position: relative; z-index: 1; flex: 1; padding: 16px 13px 18px; display: flex; flex-direction: column; justify-content: flex-end; overflow-y: auto; }
    .bubble { max-width: 80%; margin-top: 7px; padding: 10px 12px 7px; border: 1px solid rgba(23, 26, 31, .08); font-size: 14px; line-height: 1.45; }
    .bubble.other { align-self: flex-start; border-radius: 5px 17px 17px 17px; background: rgba(255, 255, 255, .92); }
    .bubble.mine { align-self: flex-end; border-color: #218d6b; border-radius: 17px 5px 17px 17px; background: #2a9d77; color: white; }
    .bubble-meta { margin-top: 4px; display: flex; justify-content: flex-end; gap: 4px; color: rgba(23, 26, 31, .45); font-size: 9px; }
    .bubble.mine .bubble-meta { color: rgba(255, 255, 255, .72); }
    .bubble-meta .read { color: #b8f0dd; }
    .typing { position: relative; z-index: 1; min-height: 28px; padding-left: 15px; display: flex; align-items: center; gap: 4px; }
    .typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: typing 1.2s ease-in-out infinite; }
    .typing i:nth-child(2) { animation-delay: .18s; } .typing i:nth-child(3) { animation-delay: .36s; }
    @keyframes typing { 0%, 100% { opacity: .22; transform: translateY(1px); } 50% { opacity: .75; transform: translateY(-2px); } }
    .composer { position: relative; z-index: 4; padding: 8px 8px 11px; display: grid; grid-template-columns: 44px 1fr 44px 56px; align-items: end; gap: 5px; border-top: 1px solid var(--line); background: var(--surface); }
    .composer button { min-height: 44px; border: 0; cursor: pointer; }
    .icon-button { border-radius: 50%; background: #eef0ed; display: grid; place-items: center; }
    .mic-shape { position: relative; width: 10px; height: 16px; border: 2px solid #4e555b; border-radius: 6px; }
    .mic-shape::before { content: ""; position: absolute; width: 16px; height: 10px; left: -5px; top: 5px; border: 2px solid #4e555b; border-top: 0; border-radius: 0 0 9px 9px; }
    .smile-shape { width: 20px; height: 20px; border: 1.8px solid #4e555b; border-radius: 50%; position: relative; }
    .smile-shape::before { content: "··"; position: absolute; top: -7px; left: 4px; font-weight: 900; letter-spacing: 3px; }
    .smile-shape::after { content: ""; position: absolute; left: 5px; bottom: 4px; width: 8px; height: 4px; border-bottom: 1.8px solid #4e555b; border-radius: 50%; }
    .composer input { min-width: 0; min-height: 44px; padding: 0 13px; border: 1px solid var(--line); border-radius: 18px; background: #fafbf9; }
    .send { border-radius: 17px; background: var(--accent); color: white; font-size: 12px; font-weight: 800; }
    .more-menu { position: absolute; z-index: 40; top: 98px; right: 13px; width: 205px; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 18px 45px rgba(31, 38, 34, .18); }
    .menu-row { width: 100%; padding: 14px 15px; border: 0; border-bottom: 1px solid var(--line); background: white; text-align: left; cursor: pointer; }
    .menu-row:last-child { border-bottom: 0; }
    .menu-row b { display: block; font-size: 13px; }
    .menu-row span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }

    .details-identity { padding: 26px 22px 28px; display: flex; flex-direction: column; align-items: center; }
    .details-identity h2 { margin: 14px 0 3px; font-size: 21px; }
    .details-identity p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .data-section { margin-top: 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: white; }
    .data-section > b { display: block; padding: 15px 18px 8px; color: var(--faint); font-size: 10px; }
    .data-row { min-height: 52px; margin-left: 18px; padding-right: 18px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); font-size: 13px; }
    .data-row span:last-child { max-width: 62%; color: var(--muted); text-align: right; }
    .data-row.action { width: calc(100% - 18px); border-right: 0; border-bottom: 0; border-left: 0; background: white; cursor: pointer; }
    .security-band { min-height: 72px; margin-top: 20px; padding: 0 18px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #c8e4da; border-bottom: 1px solid #c8e4da; background: var(--accent-soft); }
    .lock { width: 22px; height: 18px; border-radius: 5px; background: var(--accent-dark); position: relative; }
    .lock::before { content: ""; position: absolute; left: 4px; top: -10px; width: 11px; height: 12px; border: 2px solid var(--accent-dark); border-bottom: 0; border-radius: 7px 7px 0 0; }
    .security-band b { display: block; color: var(--accent-dark); font-size: 13px; }
    .security-band span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .danger { color: var(--danger) !important; }

    .nfc-base { padding: 26px 20px; }
    .nfc-base h2 { margin: 0; font-size: 24px; }
    .nfc-base > p { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .nfc-trigger { margin-top: 28px; width: 100%; min-height: 52px; border: 0; border-radius: 17px; background: var(--ink); color: white; font-weight: 750; cursor: pointer; }
    .nfc-hint { margin-top: 18px; padding: 16px; border: 1px solid var(--line); border-radius: 16px; color: var(--muted); font-size: 12px; line-height: 1.65; background: white; }
    .sheet-scrim { position: absolute; z-index: 30; inset: 0; background: rgba(23, 26, 31, .22); }
    .bottom-sheet { position: absolute; z-index: 31; right: 0; bottom: 0; left: 0; padding: 15px 22px 27px; border-radius: 28px 28px 0 0; background: var(--surface); box-shadow: 0 -18px 50px rgba(31, 38, 34, .16); }
    .sheet-handle { width: 38px; height: 4px; margin: 0 auto 20px; border-radius: 2px; background: #d7dad6; }
    .pair-person { display: flex; flex-direction: column; align-items: center; }
    .pair-person h3 { margin: 13px 0 3px; font-size: 19px; }
    .pair-person p { margin: 0; color: var(--muted); font-size: 11px; }
    .pair-progress { margin: 22px 0 18px; display: flex; justify-content: center; gap: 6px; }
    .pair-progress i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: typing 1.2s ease-in-out infinite; }
    .pair-progress i:nth-child(2) { animation-delay: .2s; } .pair-progress i:nth-child(3) { animation-delay: .4s; }
    .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .sheet-actions button { min-height: 46px; border: 0; border-radius: 15px; cursor: pointer; font-weight: 750; }
    .sheet-actions .cancel { background: #eceeeb; }
    .sheet-actions .confirm { background: var(--accent); color: white; }

    .call-screen { background: #1d2421; color: white; }
    .call-screen .status-bar { color: white; }
    .call-body { flex: 1; padding: 54px 24px 38px; display: flex; flex-direction: column; align-items: center; }
    .call-orbit { width: 184px; height: 184px; display: grid; place-items: center; border: 1px solid rgba(255, 255, 255, .12); border-radius: 50%; animation: callPulse 3.4s ease-in-out infinite; }
    @keyframes callPulse { 50% { transform: scale(1.035); border-color: rgba(112, 220, 179, .30); } }
    .call-avatar { width: 126px; height: 126px; border-radius: 50%; display: grid; place-items: center; background: #34413b; font-size: 30px; font-weight: 800; }
    .call-body h2 { margin: 25px 0 5px; font-size: 24px; }
    .call-status { color: rgba(255, 255, 255, .62); font-size: 13px; }
    .wave { height: 42px; margin-top: 32px; display: flex; align-items: center; gap: 4px; }
    .wave i { width: 3px; border-radius: 3px; background: #70dcb3; animation: wave 1.2s ease-in-out infinite; }
    .wave i:nth-child(1), .wave i:nth-child(7) { height: 9px; }
    .wave i:nth-child(2), .wave i:nth-child(6) { height: 18px; animation-delay: .12s; }
    .wave i:nth-child(3), .wave i:nth-child(5) { height: 29px; animation-delay: .24s; }
    .wave i:nth-child(4) { height: 40px; animation-delay: .36s; }
    @keyframes wave { 50% { transform: scaleY(.35); opacity: .55; } }
    .call-controls { width: 100%; margin-top: auto; display: flex; justify-content: space-around; }
    .call-control { display: grid; justify-items: center; gap: 8px; color: rgba(255, 255, 255, .72); font-size: 10px; }
    .call-control button { width: 58px; height: 58px; border: 0; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .12); color: white; cursor: pointer; }
    .call-control button.active { background: white; color: var(--ink); }
    .call-control button.hangup { background: #d85149; }
    .call-control button:disabled { cursor: not-allowed; opacity: .34; }

    .settings-intro { padding: 22px 20px 16px; }
    .settings-intro h2 { margin: 0; font-size: 23px; }
    .settings-intro p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    .setting-row { min-height: 58px; margin-left: 18px; padding-right: 18px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); }
    .setting-row b { display: block; font-size: 13px; }
    .setting-row span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .switch { width: 42px; height: 24px; padding: 3px; border: 0; border-radius: 12px; background: #c9ceca; cursor: pointer; transition: background .2s ease; }
    .switch::after { content: ""; display: block; width: 18px; height: 18px; border-radius: 50%; background: white; box-shadow: 0 2px 5px rgba(23, 26, 31, .2); transition: transform .2s ease; }
    .switch.on { background: var(--accent); }
    .switch.on::after { transform: translateX(18px); }
    .switch:disabled { cursor: not-allowed; opacity: .58; }

    .gallery-layout { min-height: 100vh; padding: 70px 30px 130px; }
    .gallery-heading { max-width: 1040px; margin: 0 auto 34px; }
    .gallery-heading h1 { margin: 0 0 10px; font-size: 38px; letter-spacing: -.04em; }
    .gallery-heading p { margin: 0; color: var(--muted); line-height: 1.7; }
    .gallery-grid { max-width: 1500px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 42px 28px; align-items: start; }
    .gallery-card { display: grid; justify-items: center; }
    .gallery-label { width: min(375px, 100%); margin-bottom: 12px; display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
    .gallery-card .phone { transform: scale(.84); transform-origin: top center; margin-bottom: calc(var(--phone-h) * -.16); }

    .lab-layout { min-height: 100vh; padding: 66px 32px 130px; }
    .lab-heading { max-width: 1100px; margin: 0 auto 28px; }
    .lab-heading h1 { margin: 0; font-size: 36px; letter-spacing: -.04em; }
    .lab-heading p { color: var(--muted); line-height: 1.7; }
    .lab-grid { max-width: 1050px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 34px; justify-items: center; }
    .lab-column h2 { margin: 0 0 12px; text-align: center; color: var(--muted); font-size: 13px; }
    .lab-notes { grid-column: 1 / -1; width: 100%; padding: 22px 24px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); }
    .lab-notes h3 { margin: 0 0 13px; font-size: 16px; }
    .lab-notes ul { margin: 0; padding-left: 18px; columns: 2; color: var(--muted); font-size: 13px; line-height: 1.8; }

    .prototype-switcher {
      position: fixed; z-index: 100; left: 50%; bottom: 22px; transform: translateX(-50%);
      min-width: 330px; padding: 7px;
      display: grid; grid-template-columns: 44px 1fr 44px; align-items: center;
      border: 1px solid rgba(255, 255, 255, .12); border-radius: 22px;
      background: #171a1f; color: white;
      box-shadow: 0 18px 45px rgba(23, 26, 31, .3);
    }
    .prototype-switcher button { width: 44px; height: 38px; border: 0; border-radius: 15px; background: rgba(255, 255, 255, .08); color: white; cursor: pointer; }
    .variant-label { text-align: center; font-size: 12px; font-weight: 750; }
    .variant-label span { display: block; margin-top: 2px; color: rgba(255, 255, 255, .55); font-size: 9px; font-weight: 500; }

    @media (max-width: 820px) {
      .workspace { grid-template-columns: 1fr; }
      .rail { position: relative; height: auto; padding: 72px 16px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
      .brand, .rail-copy { display: none; }
      .rail-label { margin-top: 0; }
      .page-nav { display: flex; overflow-x: auto; }
      .page-nav button { flex: 0 0 auto; width: auto; gap: 12px; }
      .stage { padding: 30px 14px 120px; }
      .stage-heading { text-align: center; }
      .lab-grid { grid-template-columns: 1fr; }
      .lab-notes { grid-column: 1; }
      .lab-notes ul { columns: 1; }
      .gallery-layout, .lab-layout { padding-right: 12px; padding-left: 12px; }
    }
    @media (max-width: 430px) {
      :root { --phone-w: calc(100vw - 18px); --phone-h: calc((100vw - 18px) * 2.02); }
      .phone { border-width: 6px; border-radius: 38px; }
      .prototype-note { display: none; }
      .prototype-switcher { min-width: calc(100vw - 24px); bottom: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="prototype-note">PROTOTYPE · 只用于查看页面方向</div>
  <main id="app"></main>
  <div class="prototype-switcher" aria-label="原型查看方式切换">
    <button id="prevVariant" aria-label="上一种查看方式">←</button>
    <div class="variant-label" id="variantLabel"></div>
    <button id="nextVariant" aria-label="下一种查看方式">→</button>
  </div>

  <script>
    const variants = [
      { key: "flow", name: "A · 单机交互流程", hint: "逐页点击体验" },
      { key: "gallery", name: "B · 全页面画廊", hint: "一次查看全部页面" },
      { key: "lab", name: "C · 状态对照实验室", hint: "比较 Online / Offline" },
    ];
    const pages = [
      ["login", "登录"], ["register", "注册"], ["home", "会话列表"],
      ["chat", "聊天"], ["details", "会话详情"], ["nfc", "碰一碰"],
      ["call", "语音通话"], ["settings", "设置"],
    ];
    const state = {
      page: "home",
      online: true,
      momoOnline: false,
      presenceBurst: false,
      moreOpen: false,
      nfcSheet: true,
      pairStage: "discovered",
      callActive: true,
      muted: false,
      speaker: false,
      settings: { sound: true, haptic: true, read: true },
      messageDraft: "晚点见",
      messages: [
        { mine: false, text: "明天下午有时间吗", time: "15:50" },
        { mine: true, text: "有，三点之后都行", time: "15:52", status: "✓✓" },
        { mine: false, text: "那还是老地方见 🙂", time: "15:54" },
      ],
    };
    let presenceBurstTimer = null;

    const statusBar = () => `
      <div class="status-bar"><span>9:41</span><div class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><span>Wi‑Fi</span><span class="battery"></span></div></div>`;
    const phone = (content, extra = "") => `<div class="phone ${extra}">${statusBar()}<div class="screen">${content}</div></div>`;
    const avatar = (name, online = false, size = "sm", delay = 0, arrival = false) => `<div class="avatar ${size} ${online ? "online" : ""} ${arrival ? "arrival" : ""}" style="--pulse-delay:${delay}ms">${name}</div>`;
    const moreIcon = () => `<span class="more-icon"><i></i><i></i><i></i></span>`;
    const escapeAttribute = value => String(value).replaceAll("&", "&amp;").replaceAll('"', "&quot;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");

    function loginScreen() {
      return phone(`<div class="auth-screen scroll"><div class="auth-brand"><b>Kin</b><p>只和见过的人聊天</p></div><label class="field-label">用户名</label><input class="field" value="freedom" aria-label="用户名"><label class="field-label">密码</label><input class="field" type="password" value="password123" aria-label="密码"><button class="primary" data-go="home">登录</button><button class="text-link" data-go="register">没有账号？创建一个</button></div>`);
    }
    function registerScreen() {
      return phone(`<div class="auth-screen scroll"><div class="auth-brand"><b style="font-size:29px">加入 Kin</b><p>创建只属于现实关系的聊天入口</p></div><label class="field-label">用户名 · 字母开头，4–16 位</label><input class="field" value="linchi" aria-label="新用户名"><label class="field-label">密码 · 至少 8 位，包含字母和数字</label><input class="field" type="password" value="password123" aria-label="新密码"><button class="primary" data-go="home">创建账号</button><button class="text-link" data-go="login">已有账号？返回登录</button></div>`);
    }
    function conversation(name, initials, online, preview, time, unread = "", status = "", options = {}) {
      const { person = "", delay = 0, arrival = false } = options;
      return `<button class="conversation ${arrival ? "presence-arrival" : ""}" data-go="chat" data-set-online="${online}" ${person ? `data-person="${person}"` : ""}>${avatar(initials, online, "sm", delay, arrival)}<span class="conversation-copy"><span class="conversation-name">${name}</span><span class="conversation-preview">${preview}</span></span><span class="conversation-meta"><span>${time}</span>${unread ? `<span class="unread">${unread}</span>` : status ? `<span class="status-check">${status}</span>` : ""}</span></button>`;
    }
    function homeScreen() {
      const momo = conversation("Momo", "MO", state.momoOnline, "文件我收到了", "昨天", "", "", { person: "momo", delay: 460, arrival: state.presenceBurst });
      const onlineCount = state.momoOnline ? 3 : 2;
      const offlineCount = state.momoOnline ? 1 : 2;
      return phone(`<div class="home-head"><div><h2>Kin</h2></div><div class="home-actions"><button class="small-action" data-go="nfc">+ 添加</button><button class="small-action circle-action" data-go="settings" aria-label="设置">•••</button></div></div><button class="presence-demo" data-presence-demo>${state.momoOnline ? "演示 Momo 离线" : "演示 Momo 上线"}</button><div class="scroll"><div class="section-head">Online <span>${onlineCount}</span></div>${conversation("林迟", "LC", true, "那还是老地方见 🙂", "15:54", "2", "", { delay: 80 })}${conversation("阿川", "AC", true, "[语音] 12″", "14:20", "", "✓✓", { delay: 280 })}${state.momoOnline ? momo : ""}<div class="section-head">Offline <span>${offlineCount}</span></div>${state.momoOnline ? "" : momo}${conversation("周然", "ZR", false, "下次见", "周三", "", "◷")}</div>`);
    }
    function chatTop() {
      return `<div class="topbar"><button class="top-action" data-go="home" aria-label="返回会话列表"><span class="back-icon"></span></button><div class="top-title"><strong>林迟</strong><span class="presence ${state.online ? "" : "offline"}"><i class="presence-dot"></i>${state.online ? "Online" : "Offline"}</span></div><button class="top-action" data-more aria-label="更多聊天功能">${moreIcon()}</button></div>`;
    }
    function chatScreen(forceOnline) {
      const online = typeof forceOnline === "boolean" ? forceOnline : state.online;
      const oldOnline = state.online; state.online = online;
      const messages = state.messages.map(m => `<div class="bubble ${m.mine ? "mine" : "other"}">${m.text}<div class="bubble-meta"><span>${m.time}</span>${m.mine ? `<span class="${m.status === "✓✓" ? "read" : ""}">${m.status || "◷"}</span>` : ""}</div></div>`).join("");
      const result = phone(`${chatTop()}${online ? `<div class="notice secure"><span class="lock" style="transform:scale(.55);margin:-6px"></span>仅你和对方可读取</div>` : `<div class="notice"><b>!</b> 对方当前离线，消息将在其上线后送达</div>`}<div class="ambient"></div><div class="chat-list">${messages}</div>${online ? `<div class="typing"><i></i><i></i><i></i></div>` : `<div class="typing"></div>`}<div class="composer"><button class="icon-button" aria-label="按住录制语音"><span class="mic-shape"></span></button><input id="messageInput" value="${escapeAttribute(state.messageDraft)}" aria-label="消息输入框"><button class="icon-button" aria-label="打开表情"><span class="smile-shape"></span></button><button class="send" data-send>发送</button></div>${state.moreOpen ? `<div class="more-menu"><button class="menu-row" data-go="call" ${online ? "" : "disabled"}><b>语音通话</b><span>${online ? "现在呼叫" : "对方当前离线"}</span></button><button class="menu-row" data-go="details"><b>会话详情</b><span>资料、相识信息与隐私</span></button></div>` : ""}`, online ? "chat-online" : "chat-offline");
      state.online = oldOnline;
      return result;
    }
    function detailsScreen() {
      return phone(`<div class="topbar"><button class="top-action" data-go="chat"><span class="back-icon"></span></button><div class="top-title"><strong>会话详情</strong></div><div class="top-action"></div></div><div class="scroll"><div class="details-identity">${avatar("LC", true, "lg")}<h2>林迟</h2><p>@linchi</p><p>今天也想去远一点的地方</p></div><div class="data-section"><b>关系</b><div class="data-row"><span>好友备注</span><span>林迟</span></div><div class="data-row"><span>相识时间</span><span>2026年7月18日</span></div><div class="data-row"><span>相识备注</span><span>暂无记录</span></div></div><button class="security-band" style="width:100%;border-right:0;border-left:0;text-align:left"><span class="lock"></span><span><b>仅你和对方可读取</b><span>查看这段会话如何受到保护</span></span></button><div class="data-section"><b>聊天数据</b><button class="data-row action"><span>导出当前会话</span><span>›</span></button><button class="data-row action"><span>清空本地聊天记录</span><span>›</span></button></div><div class="data-section"><b>好友关系</b><button class="data-row action"><span class="danger">删除好友</span><span>›</span></button></div></div>`);
    }
    function nfcScreen(sheet = state.nfcSheet) {
      const completed = state.pairStage === "completed";
      const selfConfirmed = state.pairStage === "self-confirmed";
      return phone(`<div class="topbar"><button class="top-action" data-go="home"><span class="back-icon"></span></button><div class="top-title"><strong>添加好友</strong></div><div class="top-action"></div></div><div class="nfc-base"><h2>碰一碰</h2><p>让两台手机靠近。发现对方后，只有你们都确认，才会建立好友关系。</p><button class="nfc-trigger" data-pair>发起碰一碰</button><button class="nfc-trigger" style="margin-top:10px;background:#fff;color:var(--ink);border:1px solid var(--line)" data-pair-receive>接收附近设备</button><div class="nfc-hint">NFC 不可用时，可以展开配对码作为降级入口。</div></div>${sheet ? `<div class="sheet-scrim"></div><div class="bottom-sheet"><div class="sheet-handle"></div><div class="pair-person">${avatar("MO", true, "lg")}<h3>Momo</h3><p>@momo · ${completed ? "双方已确认" : selfConfirmed ? "你已确认，等待对方" : "确认是你认识的人"}</p></div>${completed ? `<div style="margin:22px 0;text-align:center;color:var(--accent-dark);font-size:13px;font-weight:750">你们已经成为好友</div><button class="primary" style="margin-top:0" data-go="chat">开始聊天</button>` : selfConfirmed ? `<div class="pair-progress"><i></i><i></i><i></i></div><div style="margin:14px 0 18px;text-align:center;color:var(--muted);font-size:13px">只有 Momo 也确认后才会完成</div><div class="sheet-actions"><button class="cancel" data-pair-cancel>取消</button><button class="confirm" data-pair-peer-confirm>模拟对方确认</button></div>` : `<div style="margin:18px 0;text-align:center;color:var(--muted);font-size:13px">请核对头像和用户名</div><div class="sheet-actions"><button class="cancel" data-pair-cancel>取消</button><button class="confirm" data-pair-confirm>确认是本人</button></div>`}</div>` : ""}`);
    }
    function callScreen() {
      return phone(`<div class="call-body"><div class="call-orbit"><div class="call-avatar">LC</div></div><h2>林迟</h2><div class="call-status">${state.callActive ? "00:42 · 通话中" : "正在等待对方接听"}</div><div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="call-controls"><div class="call-control"><button class="${state.muted ? "active" : ""}" data-call="mute">${state.muted ? "开" : "静"}</button><span>${state.muted ? "取消静音" : "静音"}</span></div><div class="call-control"><button disabled aria-label="扬声器，等待原生音频路由接入">扬</button><span>扬声器</span></div><div class="call-control"><button class="hangup" data-go="chat">×</button><span>挂断</span></div></div></div>`, "call-screen");
    }
    function settingsScreen() {
      const plannedSetting = (title, hint) => `<div class="setting-row"><span><b>${title}</b><span>${hint}</span></span><button class="switch" disabled aria-label="${title}，暂不可用"></button></div>`;
      return phone(`<div class="topbar"><button class="top-action" data-go="home"><span class="back-icon"></span></button><div class="top-title"><strong>设置</strong></div><div class="top-action"></div></div><div class="scroll"><div class="settings-intro"><h2>freedom</h2><p>@freedom · 还没有留下个性签名</p></div><div class="data-section"><b>通知与状态</b>${plannedSetting("消息提示音", "等待通知声音服务接入")}${plannedSetting("好友上线提示音", "等待上线提醒声音接入")}${plannedSetting("触觉反馈", "等待真机触觉反馈接入")}${plannedSetting("展示在线状态", "等待服务端在线隐私控制接入")}</div><div class="data-section"><b>安全</b><button class="data-row action"><span>端到端加密</span><span>正常 ›</span></button><button class="data-row action"><span>本地数据保护</span><span>›</span></button></div><div class="data-section"><b>聊天数据</b><button class="data-row action"><span>导出全部消息</span><span>18 条 ›</span></button><button class="data-row action" disabled><span>导入聊天备份</span><span>暂不可用</span></button><button class="data-row action"><span>本地存储</span><span>18 条 ›</span></button></div><div class="data-section"><b>Kin</b><button class="data-row action"><span>隐私说明</span><span>›</span></button><button class="data-row action"><span>关于 Kin</span><span>0.1.0 ›</span></button><button class="data-row action"><span class="danger">退出账号</span><span>›</span></button></div></div>`);
    }
    function renderPage(name) {
      return ({ login: loginScreen, register: registerScreen, home: homeScreen, chat: chatScreen, details: detailsScreen, nfc: nfcScreen, call: callScreen, settings: settingsScreen })[name]();
    }

    function renderFlow() {
      const currentLabel = pages.find(([key]) => key === state.page)?.[1] || "页面";
      return `<div class="workspace"><aside class="rail"><div class="brand"><div class="brand-mark">K</div><div><strong>Kin Demo</strong><span>只和见过的人聊天</span></div></div><div class="rail-label">页面</div><nav class="page-nav">${pages.map(([key, label], index) => `<button class="${state.page === key ? "active" : ""}" data-go="${key}"><span>${label}</span><span class="nav-index">${String(index + 1).padStart(2, "0")}</span></button>`).join("")}</nav><p class="rail-copy">页面中的按钮可以点击。聊天页可切换在线状态、发送消息并展开更多菜单；NFC 和通话页面也包含演示状态。</p></aside><section class="stage"><header class="stage-heading"><div class="stage-kicker">当前页面 · ${currentLabel}</div><h1>Kin 的界面应安静，但不是静止。</h1><p>信息结构保持熟悉，生命感来自在线呼吸、消息涟漪、状态亮暗和克制的反馈，而不是堆叠功能入口。</p></header><div class="phone-wrap">${renderPage(state.page)}</div></section></div>`;
    }
    function renderGallery() {
      const cards = pages.map(([key, label]) => `<article class="gallery-card"><div class="gallery-label"><b>${label}</b><span>${key}</span></div>${renderPage(key)}</article>`).join("");
      return `<section class="gallery-layout"><header class="gallery-heading"><h1>Kin 全页面画廊</h1><p>这组画面按照目前的前端规范重做，重点查看页面之间是否像同一个产品：相同的留白、分隔线、圆角语言、在线绿色和低饱和离线状态。</p></header><div class="gallery-grid">${cards}</div></section>`;
    }
    function renderLab() {
      return `<section class="lab-layout"><header class="lab-heading"><h1>Online / Offline 状态实验室</h1><p>聊天结构完全不变，只让环境色、运动速度、提示文案和通话可用性发生变化。用户仍然可以在离线状态编辑和发送消息。</p></header><div class="lab-grid"><div class="lab-column"><h2>Online · 明亮、实时、正在输入</h2>${chatScreen(true)}</div><div class="lab-column"><h2>Offline · 低饱和、等待补发</h2>${chatScreen(false)}</div><div class="lab-notes"><h3>状态变化应当被感知，而不是被打断</h3><ul><li>Online 使用青绿与蓝灰呼吸色域</li><li>Offline 降低饱和度但不降低文字对比</li><li>收到消息从左侧产生一次柔和涟漪</li><li>自己发送从右侧产生一次柔和涟漪</li><li>◷ 表示正在提交或服务器排队</li><li>✓ 表示对方设备已保存，✓✓ 表示已读</li></ul></div></div></section>`;
    }

    function getVariant() {
      const key = new URLSearchParams(location.search).get("variant") || "flow";
      return variants.some(v => v.key === key) ? key : "flow";
    }
    function setVariant(key) {
      const url = new URL(location.href); url.searchParams.set("variant", key); history.replaceState({}, "", url); render();
    }
    function cycleVariant(direction) {
      const current = variants.findIndex(v => v.key === getVariant());
      setVariant(variants[(current + direction + variants.length) % variants.length].key);
    }
    function render() {
      const variant = getVariant();
      document.getElementById("app").innerHTML = variant === "gallery" ? renderGallery() : variant === "lab" ? renderLab() : renderFlow();
      const meta = variants.find(v => v.key === variant);
      document.getElementById("variantLabel").innerHTML = `${meta.name}<span>${meta.hint} · ← → 键切换</span>`;
    }

    document.addEventListener("click", event => {
      const target = event.target.closest("button"); if (!target) return;
      if (target.dataset.go) { state.page = target.dataset.go; state.moreOpen = false; if (target.dataset.setOnline) state.online = target.dataset.setOnline === "true"; render(); return; }
      if (target.hasAttribute("data-presence-demo")) {
        if (presenceBurstTimer) clearTimeout(presenceBurstTimer);
        state.momoOnline = !state.momoOnline;
        state.presenceBurst = state.momoOnline;
        const update = () => render();
        if (document.startViewTransition) document.startViewTransition(update); else update();
        if (state.presenceBurst) presenceBurstTimer = setTimeout(() => {
          state.presenceBurst = false;
          presenceBurstTimer = null;
        }, 700);
        return;
      }
      if (target.hasAttribute("data-more")) { state.moreOpen = !state.moreOpen; render(); return; }
      if (target.hasAttribute("data-send")) {
        const input = document.getElementById("messageInput"); const text = input?.value.trim(); if (!text) return;
        state.messageDraft = "";
        state.messages.push({ mine: true, text, time: "15:58", status: state.online ? "✓" : "◷" }); render();
        if (state.online) setTimeout(() => { const last = state.messages[state.messages.length - 1]; if (last?.text === text) { last.status = "✓✓"; render(); } }, 900);
        return;
      }
      if (target.hasAttribute("data-pair") || target.hasAttribute("data-pair-receive")) { state.nfcSheet = true; state.pairStage = "discovered"; render(); return; }
      if (target.hasAttribute("data-pair-cancel")) { state.nfcSheet = false; render(); return; }
      if (target.hasAttribute("data-pair-confirm")) { state.pairStage = "self-confirmed"; render(); return; }
      if (target.hasAttribute("data-pair-peer-confirm")) { state.pairStage = "completed"; render(); return; }
      if (target.dataset.call === "mute") { state.muted = !state.muted; render(); return; }
      if (target.dataset.call === "speaker") { state.speaker = !state.speaker; render(); return; }
      if (target.dataset.setting) { const key = target.dataset.setting; state.settings[key] = !state.settings[key]; render(); }
    });
    document.addEventListener("input", event => {
      if (event.target.id === "messageInput") state.messageDraft = event.target.value;
    });
    document.getElementById("prevVariant").addEventListener("click", () => cycleVariant(-1));
    document.getElementById("nextVariant").addEventListener("click", () => cycleVariant(1));
    document.addEventListener("keydown", event => {
      if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable) return;
      if (event.key === "ArrowLeft") cycleVariant(-1);
      if (event.key === "ArrowRight") cycleVariant(1);
    });
    render();
  </script>
</body>
</html>
